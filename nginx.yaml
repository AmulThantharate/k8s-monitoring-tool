apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-website
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>My Nginx Site</title>
    </head>
    <body>
      <h1>Hello from Kubernetes!</h1>
      <p>Served by pod: <b id="pod"></b></p>
      <script>
        document.getElementById("pod").textContent = window.location.hostname;
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: website
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      volumes:
        - name: website
          configMap:
            name: nginx-website
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
